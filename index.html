<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="oke 互动小说 — 精选互动故事与视觉小说">
    <meta name="theme-color" content="#0a0a0f">
    <title>oke 互动小说</title>
    <script src="./assets/version.js"></script>
    <script>
        (function () {
            var v = typeof SITE_VERSION !== 'undefined' ? SITE_VERSION : '';
            var q = v ? '?v=' + encodeURIComponent(v) : '';

            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './assets/css/home.css' + q;
            document.head.appendChild(css);

            var js = document.createElement('script');
            js.src = './assets/js/home.js' + q;
            js.defer = true;
            document.head.appendChild(js);
        })();
    </script>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1 class="header__title" id="siteTitle">oke 互动小说</h1>
            <p class="header__desc" id="siteDesc">精选互动故事与视觉小说</p>
        </header>

        <div class="status" id="loading" aria-live="polite">
            <div class="status__spinner" aria-hidden="true"></div>
            <span>正在加载游戏列表…</span>
        </div>

        <div class="status status--hidden" id="error" role="alert">
            <span id="errorMessage">加载失败</span>
            <button class="status__retry" id="retryButton" type="button">重试</button>
        </div>

        <section class="grid grid--hidden" id="gameGrid" aria-label="游戏列表"></section>

        <footer class="footer">
            <span>© <span id="year"></span> oke 互动小说</span>
            <span class="footer__version" id="siteVersion"></span>
        </footer>
    </main>
</body>
</html>
